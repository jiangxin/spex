[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spex"
version = "0.2.1"
requires-python = ">=3.11"
dependencies = [
    "jinja2",
]

[tool.setuptools]
py-modules = []
packages = []

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-include = ["scripts/spex"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow (skip with '-m \"not slow\"')"]
addopts = ["-m", "not slow"]

[tool.coverage.run]
source = ["scripts"]
include = ["scripts/*"]

[tool.coverage.report]
show_missing = true
