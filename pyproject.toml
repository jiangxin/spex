[project]
name = "sdd-skill"
version = "0.1.0"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-include = ["scripts/sdd"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["scripts"]
include = ["scripts/*"]

[tool.coverage.report]
show_missing = true
