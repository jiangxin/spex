[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spex"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
    "jinja2",
]

[tool.setuptools]
py-modules = []
packages = []

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-include = ["scripts/spex"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (skip with '-m \"not slow\"')",
    "e2e: end-to-end tests (run via make test-e2e)",
]
addopts = ["-m", "not slow and not e2e"]
log_level = "INFO"

[tool.coverage.run]
source = ["scripts"]
include = ["scripts/*"]

[tool.coverage.report]
show_missing = true
