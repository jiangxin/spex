# Dev tooling configuration only.
# The installable skill package is defined in skills/spex/pyproject.toml.
# Version is stored in skills/spex/pyproject.toml and SKILL.md — do not edit here.

[tool.ruff]
target-version = "py39"
line-length = 100
extend-include = ["skills/spex/scripts/spex"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (skip with '-m \"not slow\"')",
    "e2e: end-to-end tests (run via make test-e2e)",
]
addopts = ["-m", "not slow and not e2e"]
log_level = "INFO"

[tool.coverage.run]
source = ["skills/spex/scripts"]
include = ["skills/spex/scripts/*"]

[tool.coverage.report]
show_missing = true
