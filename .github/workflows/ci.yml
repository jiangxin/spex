name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: python -m pip install .[dev]

      - run: npm install

      - run: ruff check skills/spex/scripts/ tests/

      - run: npx markdownlint-cli2

      - run: python -m pytest
